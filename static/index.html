<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OCR Studio</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">OCR</span>
      <div>
        <h1>OCR Studio</h1>
        <p class="sub">EasyOCR + OpenCV document text extraction</p>
      </div>
    </div>
    <button id="process-folder-btn" class="btn secondary" type="button">
      <span class="btn-label">Process input folder</span>
    </button>
  </header>

  <main class="layout">
    <aside class="panel uploader">
      <section class="dropzone" id="dropzone" tabindex="0">
        <input id="file-input" type="file" multiple accept="image/png,image/jpeg,image/bmp,image/tiff,image/webp" hidden />
        <div class="dz-inner">
          <svg class="dz-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2.5"/>
            <circle cx="9" cy="9" r="1.8"/>
            <path d="M3.5 16.5l4.3-4.3 3.2 3.2 3.8-3.8 5.7 5.7"/>
          </svg>
          <p>Drag &amp; drop images here</p>
          <p class="hint">or click to browse</p>
        </div>
      </section>

      <ul id="file-list" class="file-list"></ul>
      <p id="file-count" class="muted small"></p>

      <section class="options">
        <div class="opt">
          <label for="min-conf">Min confidence <output id="conf-val">0.40</output></label>
          <input id="min-conf" type="range" min="0.05" max="0.95" step="0.05" value="0.40" />
        </div>

        <div class="opt">
          <span class="opt-label">Languages</span>
          <div id="langs" class="chips">
            <label><input type="checkbox" value="en" checked />en</label>
            <label><input type="checkbox" value="fr" />fr</label>
            <label><input type="checkbox" value="es" />es</label>
            <label><input type="checkbox" value="de" />de</label>
            <label><input type="checkbox" value="it" />it</label>
            <label><input type="checkbox" value="pt" />pt</label>
            <label><input type="checkbox" value="ru" />ru</label>
            <label><input type="checkbox" value="tr" />tr</label>
            <label><input type="checkbox" value="zh" />zh</label>
            <label><input type="checkbox" value="ja" />ja</label>
            <label><input type="checkbox" value="ko" />ko</label>
          </div>
          <input id="lang-custom" type="text" placeholder="Extra languages, comma separated" class="text-input" />
        </div>

        <div class="opt toggles">
          <label class="switch"><input id="deskew" type="checkbox" checked /><span>Deskew</span></label>
          <label class="switch"><input id="use-gpu" type="checkbox" checked /><span>Use GPU</span></label>
        </div>
      </section>

      <button id="run-btn" class="btn primary" type="button" disabled>
        <span class="spin" hidden></span>
        <span class="btn-label">Run OCR</span>
      </button>
      <p id="upload-status" class="status" hidden></p>
    </aside>

    <section class="results-wrap">
      <div class="results-head">
        <h2>Results <span id="result-count" class="count-badge"></span></h2>
        <button id="clear-results" class="btn link" type="button" hidden>Clear</button>
      </div>
      <div id="results" class="results"></div>
    </section>
  </main>

  <div id="tooltip" class="tooltip" hidden></div>

  <script src="/static/app.js"></script>
</body>
</html>
